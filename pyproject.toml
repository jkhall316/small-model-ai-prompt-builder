[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "small-model-ai-prompt-builder"
version = "0.1.0"
description = "A chat-driven prompt builder for AI coding assistants that runs on a small local model."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Jeremy Hall" }]
keywords = ["prompt", "llm", "ollama", "llama.cpp", "claude", "cursor", "fastapi"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Framework :: FastAPI",
  "Topic :: Software Development",
]
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.scripts]
prompt-builder = "prompt_builder.server:main"

[project.urls]
Homepage = "https://github.com/jkhall316/small-model-ai-prompt-builder"

[tool.setuptools.packages.find]
include = ["prompt_builder*"]

[tool.setuptools.package-data]
prompt_builder = ["static/*"]
